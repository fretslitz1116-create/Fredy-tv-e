<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>FIYI_IPTV</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body {
    margin: 0; font-family: Arial, sans-serif; background: #111; color: white;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    background: #222; padding: 12px; font-weight: bold; font-size: 18px; text-align: center;
  }
  #app {
    flex: 1; display: flex; flex-direction: column; height: 100%;
  }
  #playerContainer {
    background: black; padding: 10px; text-align: center;
  }
  video {
    width: 100%; max-height: 240px; background: black;
  }

  /* Botones de navegación más pequeños */
  #controls {
    margin-top: 8px; 
    text-align: center;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  #controls button {
    background: #0066ff; 
    color: white; 
    border: none; 
    padding: 6px 12px;        /* Reducido */
    font-size: 13px;          /* Más pequeño */
    border-radius: 6px; 
    cursor: pointer; 
    font-weight: bold;
    min-width: 110px;
  }

  #searchContainer {
    margin: 15px 0;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  #searchInput {
    flex-grow: 1;
    padding: 8px; 
    border-radius: 6px; 
    border: none; 
    font-size: 16px;
  }
  #favFilterBtn {
    background: #ffaa00;
    border: none;
    color: black;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
  #favFilterBtn.active {
    box-shadow: 0 0 8px #ffaa00;
  }
  #listSelector {
    margin-bottom: 12px;
    padding: 8px;
    border-radius: 6px;
    font-size: 16px;
    background: #222;
    color: white;
    border: none;
  }
  #status {
    margin-bottom: 10px; color: #aaa; font-size: 14px; text-align: center;
  }
  #list {
    flex: 1; overflow-y: auto; border-top: 1px solid #333;
  }
  .channel {
    padding: 12px 15px; 
    border-bottom: 1px solid #222; 
    cursor: pointer;
    display: flex; 
    justify-content: space-between; 
    align-items: center;
  }
  .channel:hover {
    background: #222;
  }
  .channel .fav-btn {
    background: none; 
    border: none; 
    color: gold; 
    font-size: 20px; 
    cursor: pointer;
  }
  #restartBtn {
    position: fixed; 
    top: 10px; 
    right: 10px; 
    background: #900; 
    color: white;
    border: none; 
    padding: 8px 12px; 
    font-size: 14px; 
    border-radius: 6px; 
    cursor: pointer;
    z-index: 1000;
  }
</style>
</head>
<body>
<header>FIYI_IPTV</header>

<div id="app">
  <button id="restartBtn">Reiniciar App</button>
  
  <div id="playerContainer">
    <video id="videoPlayer" controls autoplay muted></video>
    <div id="controls">
      <button id="prevBtn">⏮️ Anterior</button>
      <button id="nextBtn">⏭️ Siguiente</button>
      <button id="toggleFavBtn">⭐ Favorito</button>
    </div>
  </div>

  <select id="listSelector"></select>

  <div id="searchContainer">
    <input type="text" id="searchInput" placeholder="Buscar canales..." autocomplete="off" />
    <button id="favFilterBtn" title="Mostrar solo favoritos">Mostrar Favoritos</button>
  </div>

  <div id="status">Cargando canales…</div>
  <div id="list"></div>
</div>

<script>
  // ==================== VARIABLES ====================
  const m3uUrls = [
    "https://raw.githubusercontent.com/fretslitz1116-create/Fredyl1_/refs/heads/main/fredie%20prueba%201.m3u8",
  ];

  let channelsLists = [];
  let combinedChannels = [];
  let filteredChannels = [];
  let favorites = [];
  let currentChannelIndex = 0;
  let showingFavoritesOnly = false;

  // ==================== ELEMENTOS DOM ====================
  const videoPlayer = document.getElementById('videoPlayer');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const toggleFavBtn = document.getElementById('toggleFavBtn');
  const listSelector = document.getElementById('listSelector');
  const searchInput = document.getElementById('searchInput');
  const favFilterBtn = document.getElementById('favFilterBtn');
  const status = document.getElementById('status');
  const listEl = document.getElementById('list');
  const restartBtn = document.getElementById('restartBtn');

  // ==================== FUNCIONES IPTV ====================

  function parseM3U(data) {
    const lines = data.split("\n");
    const result = [];
    let name = "";
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (line.startsWith("#EXTINF")) {
        name = line.split(",").slice(1).join(",").trim() || "Canal sin nombre";
      } else if (line && !line.startsWith("#")) {
        if (name) {
          result.push({ name, url: line });
          name = "";
        }
      }
    }
    return result;
  }

  async function loadAllLists() {
    status.textContent = "Cargando listas de canales...";
    try {
      const responses = await Promise.all(m3uUrls.map(url => fetch(url)));
      const texts = await Promise.all(responses.map(r => r.text()));

      channelsLists = texts.map(text => parseM3U(text));
      combinedChannels = channelsLists.flat();

      listSelector.innerHTML = `<option value="all">Mostrar Todas las Listas</option>`;
      m3uUrls.forEach((_, i) => {
        const option = document.createElement('option');
        option.value = i;
        option.textContent = `Lista ${i + 1}`;
        listSelector.appendChild(option);
      });

      listSelector.value = "all";
      filteredChannels = combinedChannels;

      renderChannels();
      playChannelByIndex(0);
      status.textContent = `Canales cargados: ${filteredChannels.length}`;

    } catch (error) {
      console.error("Error cargando listas:", error);
      status.textContent = "Error al cargar las listas IPTV. Revisa tu conexión.";
    }
  }

  function renderChannels() {
    listEl.innerHTML = "";
    let channelsToShow = filteredChannels;

    if (showingFavoritesOnly) {
      channelsToShow = filteredChannels.filter(ch => favorites.includes(ch.url));
    }

    if (channelsToShow.length === 0) {
      listEl.innerHTML = `<div style="text-align:center; margin-top: 30px; color:#888;">No se encontraron canales</div>`;
      return;
    }

    channelsToShow.forEach((channel, idx) => {
      const chDiv = document.createElement("div");
      chDiv.className = "channel";
      chDiv.innerHTML = `
        <span>${channel.name}</span>
        <button class="fav-btn" title="${favorites.includes(channel.url) ? 'Quitar de favoritos' : 'Agregar a favoritos'}">
          ${favorites.includes(channel.url) ? "★" : "☆"}
        </button>
      `;

      chDiv.addEventListener("click", () => playChannelByIndex(idx));

      chDiv.querySelector('.fav-btn').addEventListener("click", e => {
        e.stopPropagation();
        toggleFavorite(channel.url);
        renderChannels();
      });

      listEl.appendChild(chDiv);
    });
  }

  function playChannelByIndex(idx) {
    let channelsToPlay = showingFavoritesOnly 
      ? filteredChannels.filter(ch => favorites.includes(ch.url))
      : filteredChannels;

    if (idx < 0) idx = channelsToPlay.length - 1;
    if (idx >= channelsToPlay.length) idx = 0;

    currentChannelIndex = idx;
    const channel = channelsToPlay[idx];
    if (!channel) return;

    videoPlayer.src = channel.url;
    videoPlayer.play().catch(() => {});
  }

  function toggleFavorite(url) {
    const index = favorites.indexOf(url);
    if (index === -1) {
      favorites.push(url);
    } else {
      favorites.splice(index, 1);
    }
  }

  function filterChannelsByList() {
    const val = listSelector.value;
    if (val === "all") {
      filteredChannels = combinedChannels;
    } else {
      filteredChannels = channelsLists[parseInt(val)] || [];
    }
    applySearchAndFilter();
  }

  function applySearchAndFilter() {
    const searchTerm = searchInput.value.toLowerCase().trim();
    let base = (listSelector.value === "all") ? combinedChannels : filteredChannels;

    let filtered = base.filter(ch => ch.name.toLowerCase().includes(searchTerm));

    if (showingFavoritesOnly) {
      filtered = filtered.filter(ch => favorites.includes(ch.url));
    }

    filteredChannels = filtered;
    renderChannels();
  }

  // ==================== EVENTOS ====================
  listSelector.addEventListener('change', filterChannelsByList);
  searchInput.addEventListener('input', applySearchAndFilter);

  favFilterBtn.addEventListener('click', () => {
    showingFavoritesOnly = !showingFavoritesOnly;
    favFilterBtn.classList.toggle('active', showingFavoritesOnly);
    applySearchAndFilter();
  });

  prevBtn.addEventListener('click', () => playChannelByIndex(currentChannelIndex - 1));
  nextBtn.addEventListener('click', () => playChannelByIndex(currentChannelIndex + 1));

  toggleFavBtn.addEventListener('click', () => {
    const currentChannels = showingFavoritesOnly 
      ? filteredChannels.filter(ch => favorites.includes(ch.url))
      : filteredChannels;
    
    if (currentChannels.length === 0) return;
    
    const currentChannel = currentChannels[currentChannelIndex] || currentChannels[0];
    toggleFavorite(currentChannel.url);
    renderChannels();
  });

  restartBtn.addEventListener('click', () => {
    if (confirm("¿Reiniciar la aplicación?")) {
      location.reload();
    }
  });

  // ==================== INICIO ====================
  loadAllLists();

</script>
</body>
</html>
